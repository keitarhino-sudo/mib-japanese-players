name: MLB日本人選手 日次レポート

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 00:00 UTC = 09:00 JST（朝の速報）
    - cron: '0 5 * * *'   # 毎日 05:00 UTC = 14:00 JST（午後の確定版）
  workflow_dispatch: # GitHubの画面から手動実行も可能

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: MLBレポート送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          REPORT_SLOT: ${{ (github.event.schedule == '0 5 * * *') && 'afternoon' || 'morning' }}
        run: python mlb_report.py
