name: MLB日本人選手 日次レポート

on:
  workflow_dispatch: # GitHubの画面から手動実行のみ（自動送信は廃止）

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: MLBレポート送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          REPORT_SLOT: ${{ (github.event.schedule == '0 5 * * *') && 'afternoon' || 'morning' }}
        run: python mlb_report.py
